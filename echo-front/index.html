<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Echo</title>
    <!--
      Appearance boot script — MUST stay inline, synchronous, and above the
      bundle. It applies the user's cached theme to <html> before the browser
      paints, which is the only way to avoid a flash of the default theme on
      every reload.

      It duplicates a small amount of logic from
      `src/features/appearance/apply.ts` (the attribute contract) and
      `storage.ts` (the key) on purpose: importing them would make this a
      module, modules are deferred, and a deferred script paints too late. The
      test `src/features/appearance/apply.test.ts` asserts the attributes below
      match what `applyPreferences` writes, so the two can't drift silently.

      Everything is wrapped in try/catch — localStorage throws in private
      browsing, and a failed theme lookup must never stop the app from booting.
      Falling through leaves no `data-theme`, which index.css handles
      with a `:root` fallback identical to the default theme.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var raw = localStorage.getItem("echo.appearance");
          var prefs = raw ? JSON.parse(raw) : {};

          var mode = prefs.mode || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          root.classList.toggle("dark", dark);
          root.dataset.theme = prefs.theme || "default";
          root.dataset.density = prefs.density || "comfortable";
          root.dataset.reducedMotion = prefs.reducedMotion || "system";
        } catch (e) {
          /* no cached preference, or storage unavailable — defaults apply */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
