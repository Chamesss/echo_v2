# Render Blueprint — one Docker web service (Express SPA + REST + WebSockets on
# Bun). The database is EXTERNAL (Neon), so no managed Postgres here. Secrets/URLs
# marked `sync: false` are filled in the dashboard.
#
# DATABASE_URL MUST be Neon's DIRECT (non-pooled) connection string — the one
# WITHOUT `-pooler` in the host, ending in `?sslmode=require`. The pooled string
# (PgBouncer transaction mode) silently breaks LISTEN/NOTIFY (realtime) AND the
# `search_path` startup option this app relies on.
#
# After the FIRST deploy:
#   1. Set DATABASE_URL to your Neon direct string.
#   2. Set BETTER_AUTH_URL + CORS_ORIGINS to the service's https URL (same value).
#
# Migrations are NOT a manual step. The server runs both control-plane and tenant
# migrations at boot, before it listens, and refuses to start if either fails —
# see src/boot/migrate-on-boot.ts. This used to say "run migrations once", which
# was the bug: they're per-deploy, not one-time, so any deploy that added one and
# didn't get a human into a shell left the database behind the code.
#
# Railway: no blueprint needed — point a service at echo-server/Dockerfile with
# the repo root as build context and set the same env vars.
services:
  - type: web
    name: echo
    runtime: docker
    # Free instance: 512 MB, no card, sleeps after 15 min idle (wakes on the next
    # HTTP request OR WebSocket connect — the client auto-reconnects). WITHOUT this
    # line Render defaults to the paid `starter` plan, which is why a Blueprint can
    # look "not free". Bump to `starter` for always-on (no cold starts).
    plan: free
    dockerfilePath: ./echo-server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon DIRECT (non-pooled) connection string, e.g.
      #   postgresql://USER:PASS@ep-xxxx.REGION.aws.neon.tech/DBNAME?sslmode=
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Single origin: both must equal the deployed https URL of THIS service.
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # S3 (avatars + attachments)
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Transactional email. Set RESEND_API_KEY + EMAIL_FROM (from address must
      # be on a domain verified in the Resend dashboard) and leave the SMTP_*
      # block empty — it's the fallback, used only when RESEND_API_KEY is unset.
      # With neither, emails are logged instead of delivered, which silently
      # breaks password reset and workspace invites in production.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # SMTP fallback (optional)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      # true for port 465, false for 587 — omitting this defaults to false,
      # which fails against 465-only providers.
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Optional: from-address for the SMTP transport only, overrides EMAIL_FROM.
      - key: SMTP_FROM
        sync: false
      # OAuth + CAPTCHA (optional)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Turnstile: set BOTH (secret verifies server-side; site key is the PUBLIC
      # value injected into the SPA at runtime) or NEITHER. One alone breaks auth.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
# No `databases:` block — the Postgres is hosted externally on Neon (set
# DATABASE_URL above). Add one back only if you switch to Render's managed PG.
