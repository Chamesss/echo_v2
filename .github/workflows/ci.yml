name: CI

# Typecheck + tests on every push to main and every PR. The backend integration
# suite needs a real Postgres, provided here as a service container; the test
# harness (test/global-setup.ts) creates the dedicated `chat_ci` database and
# applies the control-plane migrations into it before any test runs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite derives everything else from this; global-setup CREATEs the db.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_ci

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter '*' typecheck

      - name: Test
        run: bun run --filter '*' test
